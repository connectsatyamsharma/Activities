<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      div {
        padding: 10px;
      }
      .A {
        border: 4px solid black;
        margin-left: 400px;
        margin-right: 400px;
        border-radius: 20px;
      }
      .B {
        border: 2px solid black;
        border-radius: 20px;
        border-style: dashed;
      }
      .C {
        border: 2px solid black;
        border-radius: 10px;
        text-align: center;
      }
      .D {
        border: 2px solid black;
        border-radius: 5px;
        border-style: dashed;
        margin-top: 10px;
      }
      table {
        width: 100%;
        text-align: center;
        height: 400px;
      }
      th {
        border: 2px solid black;
      }
      td {
        border-left: 2px solid black;
        border-right: 2px solid black;
      }
    </style>
  </head>
  <body>
    <div class="A">
      <div class="B">
        <div class="C">
          <h2>Marks Table</h2>
        </div>
        <div class="D">
          <table>
            <tr>
              <th>Student</th>
              <th>Maths</th>
              <th>Physics</th>
              <th>Computer Science</th>
            </tr>
            <tr>
              <td>Name</td>
              <td>54</td>
              <td>32</td>
              <td>24</td>
            </tr>
            <tr>
              <td>Name</td>
              <td>74</td>
              <td>52</td>
              <td>44</td>
            </tr>
            <tr>
              <td>Name</td>
              <td>34</td>
              <td>62</td>
              <td>74</td>
            </tr>
            <tr>
              <td>Name</td>
              <td>64</td>
              <td>82</td>
              <td>70</td>
            </tr>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
